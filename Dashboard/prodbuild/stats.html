<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgniRath Statistics</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font-family:Inter,system-ui,Arial}.top{padding:20px 28px;background:#172033;border-bottom:1px solid #374151;display:flex;justify-content:space-between;align-items:center}.top a{color:#93c5fd;text-decoration:none}.wrap{max-width:1600px;margin:auto;padding:24px}.panel,.card{background:#182235;border:1px solid #344155;border-radius:14px;padding:18px}.panel{margin-bottom:20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.logs{max-height:250px;overflow:auto;margin:15px 0;display:grid;gap:8px}.log{display:flex;justify-content:space-between;padding:10px;background:#111827;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 15px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#374151}.btn.red{background:#b91c1c}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0}.value{font-size:1.7rem;font-weight:800;margin-top:8px}.label{color:#94a3b8;font-size:.85rem;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.chart{height:320px;position:relative}.chart canvas{width:100%;height:100%;background:#111827;border-radius:8px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #334155;text-align:left}.status{color:#86efac}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{padding:16px}.wrap{padding:14px}}
</style></head><body>
<div class="top"><div><b>📊 AgniRath Memory & Statistics</b><div id="state" class="status">Loading…</div></div><a href="/">← Back to Live Dashboard</a></div>
<div class="wrap">
<div class="panel"><h2>Historical Run Memory</h2><div class="toolbar"><button class="btn" onclick="loadSelected()">Load selected runs</button><button class="btn" onclick="startLive()">Start live session</button><button class="btn alt" onclick="stopLive()">Stop live session</button><button class="btn red" onclick="clearLive()">Clear live session</button><button class="btn alt" onclick="refresh()">Refresh</button></div><div class="logs" id="logs"></div></div>
<div class="cards" id="cards"></div>
<div class="grid">
<div class="panel"><h3>Cumulative Energy Received</h3><div class="chart"><canvas id="energyIn"></canvas></div></div>
<div class="panel"><h3>Cumulative Energy Lost</h3><div class="chart"><canvas id="energyOut"></canvas></div></div>
<div class="panel"><h3>Cumulative Distance</h3><div class="chart"><canvas id="distance"></canvas></div></div>
<div class="panel"><h3>Vehicle Velocity</h3><div class="chart"><canvas id="velocity"></canvas></div></div>
</div>
<div class="panel"><h2>Individual Runs</h2><table class="table"><thead><tr><th>Run</th><th>Distance</th><th>Energy received</th><th>Energy lost</th><th>Max speed</th><th>Active time</th></tr></thead><tbody id="runRows"></tbody></table></div>
</div>
<script>
let stats=null;
const fmt=(n,d=2)=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:d});
const time=n=>{n=Math.round(n||0);return `${Math.floor(n/3600)}h ${Math.floor(n%3600/60)}m ${n%60}s`};
async function api(url,opts){const r=await fetch(url,opts);if(!r.ok)throw new Error(await r.text());return r.json()}
async function init(){try{const d=await api('/api/stats/logs');document.getElementById('logs').innerHTML=d.logs.map((x,i)=>`<label class="log"><span><input type="checkbox" value="${esc(x.filename)}"> <b>${esc(x.filename)}</b><br><small>${new Date(x.start_time).toLocaleString()} · ${x.packet_count.toLocaleString()} packets</small></span><span>${time(x.duration_seconds)}</span></label>`).join('')||'<div>No JSONL logs found in Dashboard/Logs.</div>';await refresh()}catch(e){document.getElementById('state').textContent='Error: '+e.message}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadSelected(){const filenames=[...document.querySelectorAll('#logs input:checked')].map(x=>x.value);if(!filenames.length)return alert('Select at least one run');await api('/api/stats/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filenames})});await refresh()}
async function startLive(){await api('/api/stats/live/start',{method:'POST'});await refresh()}
async function stopLive(){await api('/api/stats/live/stop',{method:'POST'});await refresh()}
async function clearLive(){await api('/api/stats/live/clear',{method:'POST'});await refresh()}
function card(label,value){return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`}
async function refresh(){try{stats=await api('/api/stats/data');render()}catch(e){document.getElementById('state').textContent='Error: '+e.message}}
function render(){const o=stats.overall;document.getElementById('state').textContent=`${stats.live_capture?'● LIVE CAPTURE ACTIVE':'● STATIC MEMORY'} · ${stats.historical_run_count} historical runs · ${stats.live_packet_count} live packets`;
document.getElementById('cards').innerHTML=[card('Cumulative Distance',fmt(o.cumulative_distance_km)+' km'),card('Energy Received',fmt(o.cumulative_energy_received_wh/1000)+' kWh'),card('Energy Lost',fmt(o.cumulative_energy_lost_wh/1000)+' kWh'),card('Net Energy',fmt(o.net_energy_wh/1000)+' kWh'),card('Maximum Velocity',fmt(o.maximum_velocity_kmh)+' km/h'),card('Active Driving Time',time(o.total_active_time_seconds))].join('');
const t=stats.timeline;draw('energyIn',t.map((x,i)=>[i,x.cumulative_energy_received_wh/1000]),'kWh');draw('energyOut',t.map((x,i)=>[i,x.cumulative_energy_lost_wh/1000]),'kWh');draw('distance',t.map((x,i)=>[i,x.cumulative_distance_km]),'km');draw('velocity',t.map((x,i)=>[i,x.velocity_kmh]),'km/h');
document.getElementById('runRows').innerHTML=stats.runs.map(r=>`<tr><td>${esc(r.filename)}</td><td>${fmt(r.stats.distance_km)} km</td><td>${fmt(r.stats.energy_received_wh/1000)} kWh</td><td>${fmt(r.stats.energy_lost_wh/1000)} kWh</td><td>${fmt(r.stats.max_velocity_kmh)} km/h</td><td>${time(r.stats.active_time_seconds)}</td></tr>`).join('')||'<tr><td colspan="6">Load historical runs or start a live session.</td></tr>'}
function draw(id,data,unit){const c=document.getElementById(id),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1,w=Math.max(1,r.width),h=Math.max(1,r.height);c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);x.fillStyle='#94a3b8';if(!data.length){x.fillText('No data loaded',20,30);return}const vals=data.map(p=>p[1]).filter(Number.isFinite),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,pad=38;x.strokeStyle='#334155';for(let i=0;i<5;i++){let y=pad+i*(h-2*pad)/4;x.beginPath();x.moveTo(pad,y);x.lineTo(w-pad,y);x.stroke()}x.strokeStyle='#22c55e';x.lineWidth=2;x.beginPath();data.forEach((p,i)=>{const px=pad+(w-2*pad)*(i/Math.max(1,data.length-1));const py=h-pad-(h-2*pad)*((p[1]-min)/span);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#cbd5e1';x.font='12px system-ui';x.fillText(`${fmt(max)} ${unit}`,pad,18);x.fillText(`${fmt(min)} ${unit}`,pad,h-8)}
setInterval(()=>{if(stats?.live_capture)refresh()},3000);init();
</script></body></html>
